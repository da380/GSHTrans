name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three compilers, both build types. Clang carries its own package list
  # because it needs an OpenMP runtime of its own -- libomp rather than the
  # libgomp the GCC entries get for free -- which is also why it took a while
  # to be gated on: no clang OpenMP runtime is installed on the development
  # machine, so this leg was advisory until it had been seen to pass here.
  #
  # Every entry has a BLAS and demands it: GSHTRANS_WITH_BLAS is ON and not
  # AUTO, so a runner without one fails to configure instead of quietly
  # building without the matrix kernel. That is not hypothetical. For as long
  # as no job installed a BLAS, every job logged "the matrix transform kernel
  # is not built", the kernel's tests compiled to nothing, its example
  # returned zero without running, and an installed package that could not be
  # consumed on a machine *with* a BLAS went unnoticed -- all green.
  #
  # The GCC entries take the OpenMP build of OpenBLAS, which shares libgomp
  # with the library and is what the library serialises by itself. Clang uses
  # libomp, and two OpenMP runtimes in one process is the thing lessons.md
  # warns about, so it takes the pthread build and the environment variable
  # that build needs.
  build:
    name: ${{ matrix.compiler.cxx }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {cxx: g++-13, packages: g++-13 libopenblas-openmp-dev}
          - {cxx: g++-14, packages: g++-14 libopenblas-openmp-dev}
          - cxx: clang++-18
            packages: clang-18 libomp-18-dev libopenblas-pthread-dev
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build \
            ${{ matrix.compiler.packages }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DGSHTRANS_WITH_BLAS=ON

      - name: Build
        run: cmake --build build --parallel

      # The examples are registered as tests, so this runs them as well as the
      # suite. That is the point: they were compile-only once and six of them
      # were aborting.
      - name: Test
        # Read only by a pthread OpenBLAS, which is clang's; inert elsewhere.
        env:
          OPENBLAS_NUM_THREADS: 1
        run: ctest --test-dir build --output-on-failure

  # Both optional dependencies off, which is a supported configuration and
  # therefore one that has to be run rather than asserted. The library
  # *withdraws* facilities there rather than disabling them -- no
  # Scheme::Bicubic(), no TransformKernel::Matrix(), no
  # RadialSplineDerivative.hpp -- so a mistake shows up as a build failure in
  # code that should not have been compiled, which the default build cannot
  # see. It is also the cheapest job here: nothing is fetched and no BLAS is
  # linked.
  minimal:
    name: no optional dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build g++-14

      - name: Configure, build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGSHTRANS_WITH_INTERPOLATION=OFF \
            -DGSHTRANS_WITH_BLAS=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # Without OpenMP, which is a supported configuration for the same reason:
  # the pragmas are then unknown to the compiler and everything the library
  # asks of the runtime goes through GSHTrans/OpenMP.hpp, so what this leg
  # catches is an omp_* call or an <omp.h> that went around the shim. (A
  # variable used only inside a pragma is an unused-variable warning in this
  # log and in no other.) The BLAS stays on: a serial library over a BLAS is
  # a combination somebody will build, and the benchmark, which measures
  # threading, is what this configuration leaves out.
  serial:
    name: no OpenMP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build g++-14 \
            libopenblas-openmp-dev

      - name: Configure, build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGSHTRANS_WITH_OPENMP=OFF \
            -DGSHTRANS_WITH_BLAS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # AddressSanitizer and UndefinedBehaviorSanitizer together, which is what
  # the script's "address" mode is, under two compilers and with the matrix
  # kernel built -- the raw-pointer GEMM code with its leading dimensions is
  # the part of the library most able to hide a memory error, and for a long
  # while it was the part no sanitizer ever saw.
  #
  # There was an "undefined" entry here. It ran a strict subset of what
  # "address" runs, under the same compiler, so it could not fail alone.
  #
  # The clang entry cannot be run on the development machine, which has no
  # clang OpenMP runtime, so this is the only place it is ever seen. It was
  # advisory until it had passed here, as the clang build entry once was.
  sanitizers:
    name: sanitizers / ${{ matrix.toolchain.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: gcc
            packages: libopenblas-openmp-dev
            arguments: -DGSHTRANS_WITH_BLAS=ON
          - name: clang
            packages: clang-18 libomp-18-dev libopenblas-pthread-dev
            arguments: >-
              -DCMAKE_CXX_COMPILER=clang++-18 -DGSHTRANS_WITH_BLAS=ON
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ${{ matrix.toolchain.packages }}

      - name: Run the sanitized test suite
        env:
          OPENBLAS_NUM_THREADS: 1
        run: >-
          ./scripts/test_sanitized.sh address
          ${{ matrix.toolchain.arguments }}

  # The tree is clang-format clean against the checked-in .clang-format, and
  # this is what keeps it so. A one-off run decays the moment the next commit
  # lands; the check is what makes it a property.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check the formatting
        run: |
          git ls-files '*.hpp' '*.cpp' \
            | xargs clang-format-18 --dry-run --Werror

  # The documentation is written rather than inferred: EXTRACT_ALL is off and
  # WARN_IF_UNDOCUMENTED is on, so an undocumented public entity is a doxygen
  # warning and WARN_AS_ERROR makes it fail here. The library is fully
  # covered, so what this leg catches is a regression rather than a backlog.
  docs:
    name: documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build doxygen

      - name: Configure and build the documentation
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGSHTRANS_BUILD_TESTS=OFF \
            -DGSHTRANS_BUILD_EXAMPLES=OFF \
            -DGSHTRANS_BUILD_BENCHMARKS=OFF
          cmake --build build --target docs

      - name: Show the warnings
        if: always()
        run: cat build/docs/doxygen-warnings.log

  package:
    name: install and find_package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev ninja-build \
            libopenblas-openmp-dev

      # With a BLAS, and required: the exported target then names BLAS::BLAS,
      # and whether the installed package can still be consumed is exactly the
      # question. It could not, once, and this job passed regardless because
      # the runner had no BLAS to find.
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/prefix" \
            -DGSHTRANS_WITH_BLAS=ON \
            -DGSHTRANS_BUILD_TESTS=OFF \
            -DGSHTRANS_BUILD_EXAMPLES=OFF \
            -DGSHTRANS_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel
          cmake --install build

      # The point of the install rules is that a separate project can consume
      # them, so consume them from a separate project. This is also what would
      # have caught the stale FindFFTW.cmake that stopped this library
      # configuring at all against a current FFTWpp.
      - name: Consume the installed package
        run: |
          cmake -S tests/package -B build-package -G Ninja \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/prefix"
          cmake --build build-package --parallel
          ctest --test-dir build-package --output-on-failure
